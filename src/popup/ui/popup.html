<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Winnow</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        width: 320px; margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px; line-height: 1.45;
        background: #fff; color: #16181d;
      }
      header { padding: 14px 16px 10px; border-bottom: 1px solid #eceef2; }
      .brand { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
      .tagline { font-size: 12px; color: #6b7280; margin-top: 1px; }
      main { padding: 14px 16px; }
      .state { display: flex; gap: 12px; align-items: center; }
      .grade {
        width: 44px; height: 44px; flex: none; border-radius: 9px;
        display: grid; place-items: center; font-size: 23px; font-weight: 700;
        background: #f0f1f4; color: #5b6472;
      }
      .grade.good { background: #e7f6ec; color: #17663a; }
      .grade.mixed { background: #fef6e7; color: #8a5a00; }
      .grade.bad { background: #fdecec; color: #96231d; }
      .state h1 { margin: 0; font-size: 14px; font-weight: 700; }
      .state p { margin: 2px 0 0; font-size: 12px; color: #6b7280; }
      .basis {
        margin: 12px 0 0; padding: 9px 10px; border-radius: 8px;
        background: #f7f8fa; font-size: 11.5px; color: #5b6472;
      }
      .row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 11px 16px; border-top: 1px solid #eceef2;
      }
      .row label { font-weight: 600; }
      footer {
        padding: 11px 16px 13px; border-top: 1px solid #eceef2; background: #fbfbfc;
        font-size: 11.5px; color: #6b7280;
      }
      .pledge { color: #17663a; font-weight: 600; display: block; margin-bottom: 3px; }
      a { color: #0b5cab; }
      @media (prefers-color-scheme: dark) {
        body { background: #16181d; color: #e8eaed; }
        header, .row, footer { border-color: #2c313a; }
        footer { background: #14161a; }
        .tagline, .state p, .basis { color: #9aa1ab; }
        .basis { background: #1d2027; }
        .grade { background: #24272e; color: #9aa1ab; }
        .grade.good { background: #10321f; color: #6ee7a0; }
        .grade.mixed { background: #33270c; color: #f5c66b; }
        .grade.bad { background: #3a1614; color: #f79c96; }
        .pledge { color: #6ee7a0; }
        a { color: #6fb0f0; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Winnow</div>
      <div class="tagline">What the reviews actually say.</div>
    </header>

    <main>
      <div class="state">
        <div class="grade" id="grade">–</div>
        <div>
          <h1 id="headline">Checking this page…</h1>
          <p id="sub"></p>
        </div>
      </div>
      <p class="basis" id="basis" hidden></p>
    </main>

    <div class="row">
      <label for="enabled">Show the panel on Amazon</label>
      <input type="checkbox" id="enabled" checked />
    </div>

    <div class="row">
      <a href="#" id="options">Settings &amp; methodology</a>
    </div>

    <footer>
      <span class="pledge">No affiliate links. Ever.</span>
      Winnow is free and makes no money today. If that ever changes it will be you paying us,
      never a merchant. The scoring engine is
      <a href="https://github.com/Cristians68/Winnow" target="_blank" rel="noopener noreferrer">open source</a>
      so you can check.
    </footer>

    <script src="../index.js"></script>
  </body>
</html>
